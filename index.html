<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoGuard PRO — Multi-Rede</title>
<style>
:root{--bg:#0a0a0f;--card:#14141f;--border:#2a2a3d;--text:#e8e8f0;--muted:#7a7a95;--neon:#00ff9d;--danger:#ff3366;--warn:#ffaa00}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px 15px}
.container{max-width:520px;margin:0 auto}
h1{text-align:center;margin-bottom:25px;color:var(--neon);font-size:1.4rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:15px}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:0.9rem}
input,select,textarea{width:100%;padding:12px;background:#0f0f17;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
button{width:100%;padding:14px;background:linear-gradient(90deg,#00ff9d,#00d4ff);border:none;border-radius:8px;font-weight:bold;color:#000;font-size:1rem;cursor:pointer;margin-top:10px}
button:disabled{opacity:0.5;cursor:not-allowed}
.resultado{margin-top:20px;white-space:pre-wrap;font-size:0.9rem;line-height:1.6}
.loading{color:var(--warn)}
.erro{color:var(--danger)}
.sucesso{color:var(--neon)}
</style>
</head>
<body>
<div class="container">
<h1>🛡️ CryptoGuard PRO</h1>

<div class="card">
<label>🔗 Endereço do Worker:</label>
<input type="text" id="workerUrl" placeholder="https://seu-worker.workers.dev">
</div>

<div class="card">
<label>📝 Endereço do Token:</label>
<input type="text" id="endereco" placeholder="0x... ou endereço Solana...">
</div>

<button id="btnAnalisar">🔍 Analisar</button>

<div id="resultado" class="card resultado"></div>
</div>

<script>
const workerUrlEl = document.getElementById('workerUrl');
const enderecoEl = document.getElementById('endereco');
const btnAnalisar = document.getElementById('btnAnalisar');
const resultadoEl = document.getElementById('resultado');

// Carrega link salvo
if(localStorage.getItem('workerUrl')){
  workerUrlEl.value = localStorage.getItem('workerUrl');
}
workerUrlEl.addEventListener('change', ()=>{
  localStorage.setItem('workerUrl', workerUrlEl.value);
});

btnAnalisar.addEventListener('click', async ()=>{
  const url = workerUrlEl.value.trim();
  const endereco = enderecoEl.value.trim();
  
  if(!url) return alert('Cole o link do Worker primeiro!');
  if(!endereco) return alert('Digite o endereço do token!');
  
  btnAnalisar.disabled = true;
  resultadoEl.innerHTML = '<div class="loading">⏳ Consultando...</div>';
  
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({endereco: endereco})
    });
    
    const dados = await res.json();
    
    // ✅ Aqui está a proteção que faltava!
    const rede = dados?.rede || 'Desconhecida';
    const mensagem = dados?.mensagem || '';
    
    resultadoEl.innerHTML = `
      <div class="sucesso">✅ Sucesso!</div>
      <br>
      <strong>Rede:</strong> ${rede}<br>
      <strong>Endereço:</strong> ${endereco}<br>
      <strong>Mensagem:</strong> ${mensagem}<br>
      <br>
      Dados recebidos do Worker com sucesso!
    `;
    
  } catch (erro) {
    resultadoEl.innerHTML = `<div class="erro">❌ Erro: ${erro.message}</div>`;
  }
  
  btnAnalisar.disabled = false;
});
</script>
</body>
</html>
